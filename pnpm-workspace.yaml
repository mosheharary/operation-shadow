packages:
  - apps/*
  - packages/*

# A single hoisted node_modules keeps the Docker volume layout simple.
nodeLinker: hoisted

# Supply-chain policy: only install package versions published at least 7 days ago
# (10080 minutes). Pinned versions in package.json files follow the same rule.
minimumReleaseAge: 10080

# Install scripts are denied unless reviewed and listed here (pnpm fails on unreviewed ones).
# These only fetch or verify prebuilt native binaries.
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

# drizzle-kit's legacy loader pins esbuild 0.18 (GHSA-67mh-4wv8-2f99 affects only esbuild's dev
# server, which nothing here runs); it works unchanged on the patched line already in the lockfile.
overrides:
  '@esbuild-kit/core-utils>esbuild': 0.25.12
